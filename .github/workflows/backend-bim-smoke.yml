name: Backend BIM smoke

on:
  push:
    branches: ["release/windows-v0.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-bim-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Compile Python backend
        run: python -m py_compile backend/bim_reconstruction.py backend/fuzzy_resf_cli.py backend/ifc_bim_export.py
      - name: Run BIM contract test
        run: python -m pytest tests/test_backend_contract.py -q
